services:
  dotnet-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: dotnet-console:dev
    container_name: dotnet-console
    stdin_open: true
    tty: true
    # args 전달 예시: docker compose run dotnet-console 10
    command: ["10"]

    # docker run --rm -v $(pwd):/app -w /app mcr.microsoft.com/dotnet/sdk:9.0 dotnet publish -c Release -o out

